version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependências]
    ignore:
      # O Expo SDK fixa a versão destes pacotes (expo/bundledNativeModules.json); fora dela o app
      # quebra em execução mesmo com a CI verde (ex.: react precisa bater com o renderer do RN).
      # Eles sobem juntos, com o SDK, via `npx expo install --fix`.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-native-community/*"
      # Saltos maiores de ferramentas dependem do ecossistema do Expo (eslint-config-expo, typescript-eslint).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependências]
