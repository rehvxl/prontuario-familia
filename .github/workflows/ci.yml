name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  db:
    name: Banco (pgTAP e lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # CLI 3.1.0 (release estável de 2026-11-09). A mesma versão está em "db:test" no package.json.
      # A action v3.2.0 instala essa versão fixa pelo npm; não usar latest.
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.1.0
      - name: Subir só o Postgres
        run: supabase db start
      - name: Lint do esquema
        run: supabase db lint --level warning --fail-on error
      - name: Testes pgTAP
        run: supabase test db
