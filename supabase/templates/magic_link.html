<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1b2430;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;">
      <tr>
        <td>
          <h1 style="margin:0 0 16px;font-size:20px;">Prontuário da Família</h1>
          <p style="margin:0 0 16px;font-size:16px;line-height:24px;">Use o código abaixo para entrar no aplicativo:</p>
          <p style="margin:0 0 24px;font-size:36px;letter-spacing:8px;font-weight:700;text-align:center;">{{ .Token }}</p>
          <p style="margin:0 0 8px;font-size:14px;line-height:20px;color:#5b6675;">O código vale por 1 hora e só pode ser usado uma vez.</p>
          <p style="margin:0;font-size:14px;line-height:20px;color:#5b6675;">Se você não pediu este código, ignore este e-mail. Ninguém acessa seus dados sem ele — e nunca compartilhe o código com outras pessoas.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
